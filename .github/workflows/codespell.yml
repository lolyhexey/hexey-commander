# Codespell configuration is within .codespellrc
---
name: Codespell

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Annotate locations with typos
        uses: codespell-project/codespell-problem-matcher@v1
      - name: Codespell
        uses: codespell-project/actions-codespell@v2
        with:
          # The action passes its own --skip, which replaces the one in
          # .codespellrc, so the generated, minified bridge bundle is skipped here too.
          skip: ./.git,*.svg,package-lock.json,*.css,.codespellrc,./src/remote-device/scripts/frida-bridges.js,./node_modules,./dist
